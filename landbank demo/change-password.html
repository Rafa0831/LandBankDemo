<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Change Password (Demo)</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;background:#eef4ea;margin:0;text-align:center;}
  .header{background:#fff;border-bottom:4px solid #c6d92e;padding:15px 30px;}
  .logo{font-size:26px;font-weight:bold;color:#1f5c22;}
  .logo span{color:#c6d92e;}
  .demo-banner{background:#ffefc2;border:1px solid #f7b500;color:#7a5900;padding:8px;font-size:13px;font-weight:bold;}
  .card{max-width:420px;margin:60px auto;background:#fff;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.15);padding:40px;text-align:left;}
  .icon{font-size:40px;color:#4c9a2a;text-align:center;}
  h2{color:#1f5c22;text-align:center;margin-top:10px;}
  p.sub{color:#777;font-size:13px;text-align:center;margin-bottom:25px;}
  label{font-size:13px;color:#333;display:block;margin-bottom:5px;}
  input{width:100%;padding:11px;margin-bottom:18px;border:1px solid #ccc;border-radius:4px;box-sizing:border-box;font-size:14px;}
  button{width:100%;padding:12px;background:#c6d92e;border:none;border-radius:4px;font-weight:bold;color:#1f5c22;cursor:pointer;font-size:15px;}
  button:hover{background:#b9cc26;}
</style>
</head>
<body>

<div class="header"><div class="logo">LAND<span>BANK</span> iAccess</div></div>

<div class="card">
  <div class="icon">🔒</div>
  <h2>Change Password</h2>
  <p class="sub">Please enter your current password and choose a new one.</p>

  <form onsubmit="window.location.href='password-changed.html'; return false;">
    <label>Current Password</label>
    <input type="password" placeholder="Enter current password" required>

    <label>New Password</label>
    <input type="password" placeholder="Enter new password" required>

    <label>Confirm New Password</label>
    <input type="password" placeholder="Re-enter new password" required>

    <button type="submit">CHANGE PASSWORD</button>
  </form>
</div>

</body>
</html>
