<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Password Changed (Demo)</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;background:#eef4ea;margin:0;text-align:center;}
  .header{background:#fff;border-bottom:4px solid #c6d92e;padding:15px 30px;}
  .logo{font-size:26px;font-weight:bold;color:#1f5c22;}
  .logo span{color:#c6d92e;}
  .demo-banner{background:#ffefc2;border:1px solid #f7b500;color:#7a5900;padding:8px;font-size:13px;font-weight:bold;}
  .card{max-width:420px;margin:80px auto;background:#fff;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.15);padding:40px;}
  .check{font-size:50px;color:#4c9a2a;}
  h2{color:#1f5c22;}
  p{color:#555;margin-bottom:25px;}
  .logout-btn{display:inline-block;width:100%;padding:12px;background:#c6d92e;border:none;border-radius:4px;font-weight:bold;color:#1f5c22;cursor:pointer;font-size:15px;text-decoration:none;box-sizing:border-box;}
  .logout-btn:hover{background:#b9cc26;}
</style>
</head>
<body>

<div class="header"><div class="logo">LAND<span>BANK</span> iAccess</div></div>

<div class="card">
  <div class="check">✔</div>
  <h2>Password Changed Successfully</h2>
  <p>Your password has been updated. This is a static confirmation screen for demonstration purposes only.</p>
  <a href="index.html" class="logout-btn">LOG OUT</a>
</div>

</body>
</html>
